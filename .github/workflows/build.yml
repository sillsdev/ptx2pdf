name: Windows installer build
on: 
  push:
    branches: [poc-github-actions]
  workflow_dispatch:

jobs:
  build-windows:
    environment: ${{ startsWith(github.ref_name, 'refs/tags/v') && 'release' || 'prerelease' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Setup msys2 environment
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: false
        release: false
        cache: true
        pacboy: >-
          adwaita-icon-theme:p
          gcc:p
          glade:p
          glib2:p
          gtk3:p
          gtksourceview3:p
          libffi:p
          poppler:p
          pyinstaller:p
          python:p
          python-cairo:p
          python-fonttools:p
          python-gobject:p
          python-lxml:p
          python-numpy:p
          python-pillow:p
          python-pip:p
          python-platformdirs:p
          python-pyopenssl:p
          python-regex:p

    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup ptxprint and it's dependencies.
      run: >- 
        pip install --user --only-binary=:all: .[gui]

    - name: Build installer
      env:
        MSYS2_DIR: ${{ steps.msys2.outputs.msys2-location }}\${{env.MSYSTEM}}
        LOG_LEVEL: ${{ runner.debug == '1' && 'DEBUG' || 'INFO' }}
      run: pyinstaller --log-level $LOG_LEVEL ptxprint.spec
      
    - name: Sign executable
      if: ${{ vars.SKIP_CODESIGN != '1' }}
      uses: sillsdev/codesign/trusted-signing-action@v3
      with:
        credentials: ${{ secrets.TRUSTED_SIGNING_CREDENTIALS }}
        files-folder: Output/
        files-folder-filter: exe
        description:  'Bible Publication Software'
        description-url: 'https://software.sil.org/ptxprint/'
    
    - name: Generate download info
      shell: pwsh
      if: ${{ vars.SKIP_CODESIGN != '1' }}
      run: |
        $exe_obj = Get-Item -Path "Setup*.exe"
        $ver_inf = $exe_obj.VersionInfo
        @{name=$ver_inf.ProductName.TrimEnd()
          version=$ver_inf.ProductVersion.TrimEnd()
          date=($exe_obj.CreationTime | Get-Date -UFormat "%%Y-%%m-%%d")
          category="installer"
          description=$ver_inf.FileDescription.TrimEnd()
          installer="1"
          platform="win"
          architecture="x86_64"
          file=$exe_obj.Name.TrimEnd()
          type="exe"
          size=$exe_obj.Length.ToString()
          sidebar="yes"
        } | ConvertTo-Json | Tee-Object -FilePath "latest.win.json" | Out-File -Encoding "UTF8" -FilePath "$exe_obj.download_info"

    - name: Upload signed exe
      uses: actions/upload-artifact@v4
      with:
        name: PTXPrint bundle
        path: |
          Output/Setup*.exe
          latest.*.json
          *.download_info
        if-no-files-found: error
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    environment: ${{ startsWith(github.ref_name, 'refs/tags/v') && 'release' || 'prerelease' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup ptxprint and it's dependencies.
      run: >- 
        pip install --user --only-binary=:all: . pyinstaller

    - name: Install the Apple certificate and provisioning profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      if: ${{ vars.SKIP_CODESIGN != '1' }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        # import certificate and provisioning profile from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH
        # create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        # import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH
        # apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
    
    - name: Build installer
      env:
        LOG_LEVEL: ${{ runner.debug == '1' && 'DEBUG' || 'INFO' }}
      run: pyinstaller --log-level $LOG_LEVEL ptxprint.spec
    
    - name: Upload signed exe
      uses: actions/upload-artifact@v7
      with:
        name: PTXPrint bundle
        path: |
          Output/Setup*.exe
          latest.*.json
          *.download_info
        if-no-files-found: error
        retention-days: 7
  
  publish:
    environment:
      name: release
      url: https://software.sil.org/ptxprint/download/
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: false
    steps:
    - uses: actions/download-artifact@v8
      with:
        name: PTXPrint bundle

    - name: ssh-agent-deploy-key
      uses: cardoe/ssh-agent-deploy-key@v1.1.0
      with:
        ssh-private-key: ${{secrets.PUBLISH_PK}}
        ssh-known-hosts: ${{secrets.PUBLISH_HK}}
    
    - name: Upload deliverables to distribution server
      run: scp *.dmg *.exe *.download_info latest.*.json ${{secrets.PUBLISH_REMOTE_AREA}}